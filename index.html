<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda de Contatos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Agenda de Contatos <span>&#128221;</span></h1>

  <form id="form-contato">
    <label for="nome">Nome:</label>
    <input type="text" id="nome" required>
    <label for="telefone">Telefone:</label>
    <input type="text" id="telefone" required>
    <button type="button" onclick="adicionarContato()">Cadastrar <span>+</span></button>
  </form>

  <!-- Campo de Pesquisa -->
  <div id="campo-pesquisa">
    <input type="text" id="pesquisa-contato" placeholder="Pesquise um contato">
    <button onclick="pesquisarContato()">Pesquisar</button>
  </div>

  <table id="tabela-contatos">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Telefone</th>
      </tr>
    </thead>
    <tbody>
      <!-- As linhas serão adicionadas aqui -->
    </tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
